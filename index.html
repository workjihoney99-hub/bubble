<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#BACEE0">
<title>bubble</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#fff;color:#191919;-webkit-text-size-adjust:100%}
#app{position:relative;background:#BACEE0;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.hidden{display:none!important}

.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 28px;background:#fff}
.screen label{align-self:stretch;font-size:12px;color:#888;display:flex;flex-direction:column;gap:4px}
.screen input:not([type=file]){height:44px;border:0;border-bottom:1px solid #ddd;font-size:16px;color:#191919;outline:0;background:none;font-family:inherit}
.screen button{align-self:stretch;height:48px;border:0;border-radius:6px;background:#FEE500;color:#191919;font-size:16px;font-weight:600;margin-top:6px}
.screen button:disabled{background:#eee;color:#aaa}
#pic{width:96px;height:96px;border-radius:40%;object-fit:cover;background:#ddd;cursor:pointer}
.hint{font-size:12px;color:#999;text-align:center;line-height:1.6}
.err{color:#d33}

.screen select{height:44px;border:0;border-bottom:1px solid #ddd;font-size:16px;color:#191919;outline:0;background:none;font-family:inherit}
.ai{margin:14px auto;max-width:82%;background:rgba(255,255,255,.7);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.5;color:#33404c;text-align:center;white-space:pre-wrap;word-break:keep-all}
.ai b{display:block;font-size:11px;font-weight:600;color:#6b7b8a;margin-bottom:3px}
.screen .link{background:none;height:auto;margin-top:0;font-size:14px;font-weight:400;color:#888}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
#tpic{cursor:pointer}
#menu{margin-left:auto;flex:none;width:36px;height:36px;border:0;background:none;color:#3d4b58;cursor:pointer;display:flex;align-items:center;justify-content:center}
#top img{width:38px;height:38px;border-radius:40%;object-fit:cover;background:#fff}
#top .name{font-size:17px;font-weight:600}
#top .day{font-size:12px;color:#4a5a6a}
#list{flex:1;overflow-y:auto;padding:6px 12px}
.date{text-align:center;margin:12px 0}
.date span{display:inline-block;font-size:11px;color:#3c4a58;background:rgba(0,0,0,.12);padding:4px 12px;border-radius:14px}
.msg{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;margin:4px 0}
.meta{font-size:10px;text-align:right;line-height:1.4;white-space:nowrap}
.meta b{display:block;color:#F7E600;font-weight:600}
.meta span{color:#555}
.bub{background:#FEE500;color:#191919;font-size:15px;line-height:1.4;padding:8px 11px;border-radius:12px;max-width:72%;word-break:break-word;white-space:pre-wrap}
.photo{max-width:60%;border-radius:12px;display:block;cursor:pointer}
#bar{position:relative;display:flex;align-items:flex-end;gap:8px;background:#fff;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#add{width:36px;height:36px;border:0;background:none;font-size:26px;line-height:1;color:#777;cursor:pointer}
#txt{flex:1;border:0;outline:0;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:8px 14px;border-radius:18px;background:#f2f3f5;font-family:inherit;color:#191919}
#send{width:46px;height:36px;border:0;border-radius:18px;background:#FEE500;font-size:14px;font-weight:600;color:#191919}
#view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9}
#view img{max-width:100%;max-height:100%}

/* PC: 폰 프레임 안에. 모바일: 그대로 전체 화면. (기본 규칙 뒤에 있어야 이김) */
@media(min-width:600px){
 body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
 #app{width:390px;height:844px;max-height:calc(100vh - 40px);border:12px solid #111;border-radius:52px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.28)}
 #app::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#111;border-radius:16px;z-index:5}
 #top{padding-top:48px}
 .screen{padding-top:60px;padding-bottom:60px}
 #bar{padding-bottom:34px}
 #bar::after{content:'';position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111}
}
</style>
</head>
<body>
<div id="app">
 <form id="login" class="screen hidden">
  <label>내 닉네임<input id="nick" type="text" autocomplete="username" required></label>
  <label>잠금 암호 (8자 이상)<input id="pass" type="password" minlength="8" autocomplete="current-password" required></label>
  <button id="loginBtn">들어가기</button>
  <p class="hint" id="loginHint">이메일도 전화번호도 안 받아요. 닉네임과 암호가 전부예요.<br>둘 중 하나라도 잊으면 아무도 복구할 수 없어요.</p>
 </form>

 <form id="setup" class="screen hidden">
  <img id="pic" alt="프로필 사진">
  <input id="file" type="file" accept="image/*" class="hidden">
  <label>상대 이름<input id="name" type="text" autocomplete="off" required></label>
  <label>헤어진 날<input id="date" type="date"></label>
  <label>AI 한마디 (메시지 내용은 AI에게 안 보내요)<select id="ai"><option value="day">매일</option><option value="week">매주</option><option value="off">끔</option></select></label>
  <button id="go">방 만들기</button>
  <button type="button" id="cancel" class="link hidden">취소</button>
  <p class="hint">이 방의 메시지는 아무에게도 가지 않아요.<br>서버에도 암호문만 남아요.</p>
 </form>

 <div id="top" class="hidden"><img id="tpic" alt="프로필 사진 크게 보기"><div><div class="name" id="tname"></div><div class="day" id="tday"></div></div>
  <button id="menu" aria-label="프로필 수정"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
 </div>
 <div id="list" class="hidden"></div>
 <div id="bar" class="hidden">
  <button id="add" aria-label="사진 보내기">+</button>
  <input id="img" type="file" accept="image/*" class="hidden">
  <textarea id="txt" rows="1" placeholder="메시지 입력"></textarea>
  <button id="send">전송</button>
 </div>
 <div id="view" class="hidden"><img alt=""></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="crypto.js"></script>
<script>
// publishable key는 공개용. 데이터는 RLS + E2EE가 지킨다.
const SB_URL='https://jjyvmsbizpevcinmflfd.supabase.co',SB_KEY='sb_publishable__ouR0LZd8tV11czxkxCOwA_MZCpefkz';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const KEY='bubble.key',MSG='bubble.msgs';   // 기기엔 AES 키 + 암호문 캐시만
const load=k=>JSON.parse(localStorage.getItem(k)||'null');
const DEFAULT_PIC="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23C9CDD2'/><circle cx='50' cy='38' r='16' fill='%23fff'/><path d='M20 92c0-22 13-32 30-32s30 10 30 32z' fill='%23fff'/></svg>";
let key,profile,profileRow,msgs=load(MSG)||[],plain=[];

function show(id){
 const room=['top','list','bar'];
 for(const s of ['login','setup',...room])$(s).classList.toggle('hidden',id==='room'?!room.includes(s):s!==id);
}
const cache=()=>{try{localStorage.setItem(MSG,JSON.stringify(msgs))}catch(e){}}; // 캐시 넘치면 무시, 서버에 있음

// 이미지 파일을 작은 JPEG dataURL로. square=true면 중앙 정사각 크롭.
function shrink(file,max,square){
 return new Promise(r=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height,sx=0,sy=0;
   if(square){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;w=h=s}
   const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');
   c.width=Math.round(w*k);c.height=Math.round(h*k);
   c.getContext('2d').drawImage(img,sx,sy,w,h,0,0,c.width,c.height);
   URL.revokeObjectURL(img.src);r(c.toDataURL('image/jpeg',.75));
  };
  img.src=URL.createObjectURL(file);
 });
}

// ── 진입: 세션+기기 키 있으면 바로, 없으면 로그인 ──
async function main(){
 const {data:{session}}=await sb.auth.getSession(),k=localStorage.getItem(KEY);
 if(!session||!k){localStorage.removeItem(KEY);return show('login')}
 key=await crypto.subtle.importKey('raw',unb64(k),'AES-GCM',false,['encrypt','decrypt']);
 afterAuth();
}
async function afterAuth(){
 const {data:p,error}=await sb.from('profiles').select('salt,iv,data').maybeSingle();
 if(error)return alert('불러오기 실패: '+error.message);
 if(!p)return show('setup');
 profileRow=p;enter();
}
async function enter(){
 profile=await dec(key,profileRow);
 try{plain=await Promise.all(msgs.map(async m=>({...await dec(key,m),ts:m.ts})))}
 catch(e){msgs=[];plain=[]}                 // 다른 키로 잠긴 옛 캐시
 show('room');openRoom();
 await sync();
 maybeAi();
}
// ── 한마디: 마지막 한마디 뒤로 내가 쓴 게 있고 간격이 지났으면, AI가 "읽고"(1 사라짐) 한마디 ──
// AI에겐 D+N, 요일, 시각, 개수만 보낸다. 서버도 20시간에 한 번만 받아준다.
const GAP={day:20*36e5,week:7*864e5};
async function maybeAi(){
 const gap=GAP[profile.ai||'day'],last=plain.findLastIndex(m=>m.ai),unread=plain.length-1-last;
 if(!gap||!unread||Date.now()-plain[last<0?0:last].ts<gap)return;
 const now=new Date();
 const {data,error}=await sb.functions.invoke('hanmadi',{body:{day:dday(),weekday:now.getDay(),hour:now.getHours(),count:unread}});
 if(!error&&data?.text)push({ai:data.text});
}
async function sync(){
 const last=msgs.length?msgs[msgs.length-1].id:0;
 const {data,error}=await sb.from('messages').select('id,iv,data,ts').gt('id',last).order('id');
 if(error)return alert('불러오기 실패: '+error.message);
 for(const m of data){msgs.push(m);plain.push({...await dec(key,m),ts:m.ts})}
 if(data.length){cache();render()}
}

// ── 로그인: 닉네임+암호 → 로그인키(서버)/암호화키(기기) ──
$('login').onsubmit=async e=>{
 e.preventDefault();
 const b=$('loginBtn');b.disabled=true;b.textContent='확인 중…';
 const reset=()=>{b.disabled=false;b.textContent='들어가기'};
 const {email,password,key:k}=await derive($('pass').value,$('nick').value);
 let {error}=await sb.auth.signInWithPassword({email,password});
 if(error){
  if(!confirm('처음 보는 닉네임이에요. 새로 만들까요?\n(이미 쓰는 닉네임이면 암호가 틀린 거예요)'))return reset();
  ({error}=await sb.auth.signUp({email,password}));
  if(error)return alert(/already/i.test(error.message)?'암호가 틀려요':'실패: '+error.message),reset();
 }
 key=k;localStorage.setItem(KEY,b64(await crypto.subtle.exportKey('raw',k)));
 msgs=[];cache();                            // 다른 계정 캐시 제거
 afterAuth();
};

// ── 설정: 처음엔 방 만들기, 이후엔 오른쪽 위 ≡로 수정. 프로필은 암호화해서 올림 ──
// pic = 160px 정사각 썸네일(상단 표시용), picFull = 크게 보기용.
// ponytail: "원본"은 긴 변 1280px로 줄인 것. 진짜 원본은 수 MB라 DB에 안 넣음. 필요하면 Storage로.
let picFull=null;
$('pic').src=DEFAULT_PIC;
$('pic').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 $('pic').src=await shrink(f,160,true);picFull=await shrink(f,1280);
};
$('menu').onclick=()=>{
 $('name').value=profile.name;$('date').value=profile.date||'';$('ai').value=profile.ai||'day';$('pic').src=profile.pic;picFull=profile.picFull||null;
 $('go').textContent='저장';$('cancel').classList.remove('hidden');show('setup');
};
$('cancel').onclick=()=>show('room');
$('tpic').onclick=()=>{$('view').firstElementChild.src=profile.picFull||profile.pic;$('view').classList.remove('hidden')};
async function saveProfile(p){
 const en=await enc(key,p);
 const {data:{session}}=await sb.auth.getSession();
 const {error}=profileRow
  ?await sb.from('profiles').update(en).eq('user_id',session.user.id)
  :await sb.from('profiles').insert({salt:'v1',...en});
 if(error){alert('저장 실패: '+error.message);return false}
 profile=p;profileRow={salt:'v1',...en};return true;
}
$('setup').onsubmit=async e=>{
 e.preventDefault();
 const b=$('go'),label=b.textContent,first=!profileRow;b.disabled=true;b.textContent='잠그는 중…';
 const p={name:$('name').value.trim(),date:$('date').value,ai:$('ai').value,pic:$('pic').src};
 if(picFull)p.picFull=picFull;
 const ok=await saveProfile(p);
 b.disabled=false;b.textContent=label;
 if(!ok)return;
 if(first)return enter();
 show('room');openRoom();
};

// ── 채팅방 ──
const dateStr=ts=>new Date(ts).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
const timeStr=ts=>new Date(ts).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dday=()=>profile.date?Math.floor((Date.now()-new Date(profile.date+'T00:00'))/864e5):null;
function openRoom(){
 $('tpic').src=profile.pic;$('tname').textContent=profile.name;
 const d=dday();$('tday').textContent=d==null?'':'D+'+d;
 render();
}
function render(){
 let last='',html='';
 const lastAi=plain.findLastIndex(m=>m.ai);   // 이 앞까지는 "읽음": 1 안 보임
 plain.forEach((m,i)=>{
  const d=dateStr(m.ts);
  if(d!==last){html+=`<div class="date"><span>${d}</span></div>`;last=d}
  if(m.ai){html+=`<div class="ai"><b>한마디</b>${esc(m.ai)}</div>`;return}
  const body=m.img?`<img class="photo" src="${m.img}" alt="">`:`<div class="bub">${esc(m.t)}</div>`;
  html+=`<div class="msg"><div class="meta">${i<lastAi?'':'<b>1</b>'}<span>${timeStr(m.ts)}</span></div>${body}</div>`;
 });
 $('list').innerHTML=html;$('list').scrollTop=$('list').scrollHeight;
}
// ponytail: 서버 먼저, 성공해야 화면에 붙음. 오프라인 큐는 필요해지면.
async function push(m){
 const row={...await enc(key,m),ts:Date.now()};
 const {data,error}=await sb.from('messages').insert(row).select('id').single();
 if(error)return alert('전송 실패. 인터넷 확인해줘');
 row.id=data.id;msgs.push(row);cache();plain.push({...m,ts:row.ts});render();
}
function send(){
 const t=$('txt').value.trim();if(!t)return;
 push({t});
 $('txt').value='';$('txt').style.height='auto';$('txt').focus();
}
$('send').onclick=send;
$('add').onclick=()=>$('img').click();
$('img').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)push({img:await shrink(f,640)})};
$('list').onclick=e=>{if(e.target.classList.contains('photo')){$('view').firstElementChild.src=e.target.src;$('view').classList.remove('hidden')}};
$('view').onclick=()=>$('view').classList.add('hidden');
$('txt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$('txt').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
main();
</script>
</body>
</html>
